if(verify&&verify&&p.ed&&p.ed==U.who&&res=='OK'){x.push('Edit karne wala khud verify nahi kar sakta');}
const fin=x.length?'NG':'OK';U.res={res:fin,x,verify};
if(verify&&fin=='OK'){p.st='verified';p.smp=U.qrs.slice();p.ed='';S.aud.push([now(),U.who,'VERIFIED',p.no])}
const rc={ts:Date.now(),t:now(),who:U.who,cust:p.cust,part:p.no,mode:verify?'VERIFY':'FPA',res:fin,why:x.join('; '),qr:U.qrs[0]||''};S.rec.push(rc);save();post({rec:[new Date(rc.ts).toISOString(),rc.who,rc.cust,rc.part,rc.mode,rc.res,rc.why,rc.qr]});draw()}
function adm(a){if(!U.admin)return;const p=P();
if(a=='iw'){const n=prompt('Inspector ka naam');if(n){S.who.push(n.trim());S.aud.push([now(),U.admin,'ADD INSPECTOR',n])}}
if(a=='ap'){const c=prompt('Customer ('+Object.keys(C).join(', ')+' ya naya)'),no=prompt('Part number'),L=+prompt('QR me kitne digit hote hain? (0 = pata nahi)','0');if(c&&no){S.parts.push({no:no.trim(),cust:c.trim(),n:1,len:L||0,st:'pending',smp:[],ed:U.admin});S.aud.push([now(),U.admin,'ADD PART',no])}}
if(a=='ep'&&p){const no=prompt('Part number',p.no),L=+prompt('QR digit (0 = pata nahi)',p.len||0),r=prompt('Edit ka reason');if(no&&r){S.aud.push([now(),U.admin,'EDIT '+p.no+'->'+no+' digit'+(p.len||0)+'->'+L,r]);p.no=no.trim();p.len=L||0;p.st='reverify';p.smp=[];p.ed=U.admin;U.part=p.no}}
if(a=='pw'){const n=prompt('Naya password');if(n)S.pw=n}
if(a=='url'){const n=prompt('Google Apps Script web app URL (/exec)',S.url||'');if(n!==null){S.url=n.trim();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}location.reload();return}}
save();draw()}
function gate(){const w=prompt('Password');if(w===S.pw){const n=prompt('Aap kaun ho? (QA Head / QA Engineer naam)');if(n){U.admin=n;draw()}}else if(w!==null)alert('Galat password')}
function draw(){const m=$('m'),ps=S.parts.filter(p=>!U.cust||p.cust==U.cust),p=P();
let h=`<div class="card"><select id="w" onchange="U.who=this.value"><option value="">— Inspector / Engineer chuno —</option>${S.who.map(n=>`<option ${n==U.who?'selected':''}>${E(n)}</option>`)}</select></div>
<div class="tabs"><button class="${U.tab=='f'?'on':''}" onclick="U.tab='f';draw()">Scan</button><button class="${U.tab=='r'?'on':''}" onclick="U.tab='r';draw()">Record</button><button class="${U.tab=='a'?'on':''}" onclick="U.tab='a';draw()">Admin</button></div>`;
if(U.tab=='f'){h+=`<div class="card"><select onchange="U.cust=this.value;U.part='';U.qrs=[];U.res=null;draw()"><option value="">Sab customer</option>${Object.keys(C).concat(S.parts.map(x=>x.cust)).filter((v,i,a)=>a.indexOf(v)==i).map(c=>`<option ${c==U.cust?'selected':''}>${E(c)}</option>`)}</select>
<select onchange="U.part=this.value;U.qrs=[];U.res=null;stop();draw()"><option value="">— Part chuno —</option>${ps.map(x=>`<option value="${E(x.no)}" ${x.no==U.part?'selected':''}>${ico[x.st]} ${E(x.no)}</option>`)}</select></div>`;
if(p){const v=p.st!='verified';h+=`<div class="card"><b>${v?'PART VERIFICATION (pehli baar)':'FPA'}</b> <span class="mu">${E(p.cust)} · ${p.len?p.len+' digit':STRICT.includes(p.cust)?'digit tay nahi':'variable'}</span>${p.st=='reverify'?'<div class="mu">Data edit hua hai, dobara verify karo</div>':''}
<video id="v" playsinline muted style="display:none"></video><button onclick="cam()">📷 Camera se QR scan</button>
<input id="sc" placeholder="Scanner se / type karke QR, phir Enter" onkeydown="if(event.key=='Enter'){add(this.value);this.value=''}">
${U.qrs.map((q,i)=>`<div class="qr">QR${i+1}: ${E(q)}</div>`).join('')}<div class="mu">${U.qrs.length}/${p.n} scan hue ${U.msg}</div>
<input type="file" id="ph" accept="image/*" capture="environment" style="display:none" onchange="ocr(this)"><button class="g" onclick="$('ph').click()">🔤 Label ka photo se text padho (OCR)</button><div class="mu" id="ocs"></div><textarea id="pt" rows="3" placeholder="Label pe jo likha hai (OCR se aayega ya type karo). Capital/small/space ka farak nahi padta"></textarea><button onclick="run()">Check karo</button><button class="g" onclick="U.qrs=[];U.res=null;draw()">Reset</button></div>`;
if(U.res)h+=`<div class="res ${U.res.res=='OK'?'ok':'ng'}">${U.res.res=='OK'?'✔ OK':'✖ NOT OK'}<small>${U.res.res=='OK'?(U.res.verify?'Part verify ho gaya, ab FPA ke liye khul gaya':'FPA OK'):U.res.x.map(E).join('<br>')}</small></div>`}}
if(U.tab=='r')h+=`<div class="card"><div class="mu">Date se / Date tak</div><input type="date" value="${U.df||''}" onchange="U.df=this.value;draw()"><input type="date" value="${U.dt||''}" onchange="U.dt=this.value;draw()"><button onclick="csv()">⬇ CSV export (${fr().length} record)</button></div><div class="card tw"><table><tr><th>Time<th>Naam<th>Part<th>Type<th>Result<th>Karan</tr>${fr().slice(0,200).map(r=>`<tr><td>${r.t}<td>${E(r.who)}<td>${E(r.part)}<td>${r.mode}<td>${r.res}<td>${E(r.why)}</tr>`).join('')}</table></div>
<div class="card"><button class="g" onclick="$('csv').value=['Time,Naam,Customer,Part,Type,Result,Karan'].concat(S.rec.map(r=>[r.t,r.who,r.cust,r.part,r.mode,r.res,r.why].map(v=>'\\"'+String(v).replace(/\\"/g,'')+'\\"').join(','))).join('\\n')">Sab record text me dikhao (copy)</button><textarea id="csv" rows="4"></textarea></div>`;
if(U.tab=='a'){if(!U.admin)h+=`<div class="card"><button onclick="gate()">🔒 QA Head / QA Engineer login</button></div>`;
else h+=`<div class="card"><b>${E(U.admin)}</b><button onclick="adm('iw')">+ Inspector add</button><button onclick="adm('ap')">+ Naya part add</button>
<select onchange="U.part=this.value;draw()"><option value="">— Edit ke liye part —</option>${S.parts.map(x=>`<option ${x.no==U.part?'selected':''}>${E(x.no)}</option>`)}</select><button onclick="adm('ep')">✎ Part edit</button><button class="g" onclick="adm('url')">Google Sheet URL set ${S.url?'✅':''}</button><button class="g" onclick="adm('pw')">Password badlo</button><button class="g" onclick="U.admin=false;draw()">Logout</button></div>
<div class="card mu">Verified: ${S.parts.filter(x=>x.st=='verified').length} · Pending: ${S.parts.filter(x=>x.st=='pending').length} · Re-verify: ${S.parts.filter(x=>x.st=='reverify').length} (kul ${S.parts.length})</div>
<div class="card tw"><table>${S.aud.slice(-20).reverse().map(a=>'<tr>'+a.map(c=>'<td>'+E(c)).join('')+'</tr>').join('')}</table></div>`}
m.innerHTML=h}
async function ocr(el){const f=el.files[0];if(!f)return;const s=$('ocs');s.textContent='Padh raha hoon...';try{await new Promise((res,rej)=>{if(window.Tesseract)return res();const t=document.createElement('script');t.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';t.onload=res;t.onerror=rej;document.head.appendChild(t)});const r=await Tesseract.recognize(f,'eng');$('pt').value=r.data.text;s.textContent='Text mil gaya. Ek baar dekh lo, galat ho to theek karo, phir Check karo.'}catch(e){s.textContent='OCR nahi chala, text type kar do.'}el.value=''}
function fr(){const f=U.df?Date.parse(U.df):0,t=U.dt?Date.parse(U.dt)+864e5:1e15;return S.rec.filter(r=>(r.ts||0)>=f&&(r.ts||0)<t).slice().reverse()}
function csv(){const t=['Time,Naam,Customer,Part,Type,Result,Karan'].concat(fr().reverse().map(r=>[r.t,r.who,r.cust,r.part,r.mode,r.res,r.why].map(v=>'"'+String(v).replace(/"/g,'')+'"').join(','))).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='FPA_records.csv';a.click()}
draw();
const ld=d=>{LD=1;if(d.state)Object.assign(S,d.state);mig();S.rec=d.rec.map(r=>({ts:Date.parse(r[0]),t:new Date(r[0]).toLocaleString('en-GB'),who:r[1],cust:r[2],part:r[3],mode:r[4],res:r[5],why:r[6],qr:r[7]}));draw()};
if(GS)GS.withSuccessHandler(s=>ld(JSON.parse(s))).appLoad();else if(S.url)fetch(S.url+'?d=1').then(r=>r.json()).then(ld).catch(()=>{});
</script></body></html>
